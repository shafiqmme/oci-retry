name: Ask Oracle for a free server
# One run tries about once a minute for ~5h45m, posts a daily update on the status issue, then starts the next run itself.
# Stops for good once the Ampere A1 server exists.
on:
  workflow_dispatch:
permissions: { actions: write, contents: read, issues: write }
concurrency: oci-retry
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: retry.py }
      - run: pip install -q oci
      - name: Write API key
        env: { CONF: "${{ secrets.OCI_CONFIG }}", KEY: "${{ secrets.OCI_API_KEY }}" }
        run: |
          mkdir -p ~/.oci && printf '%s\n' "$KEY" > ~/.oci/key.pem && chmod 600 ~/.oci/key.pem
          printf '%s\n' "$CONF" | grep -v '^key_file' > ~/.oci/config && echo "key_file=~/.oci/key.pem" >> ~/.oci/config && chmod 600 ~/.oci/config
      - name: Status issue
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "A1 status in:title" --json number -q '.[0].number')
          [ -z "$n" ] && n=$(gh issue create -R "$GITHUB_REPOSITORY" -t "A1 status" -b "Daily updates from the retry job." | grep -o '[0-9]*$')
          echo "ISSUE=$n" >> "$GITHUB_ENV"
      - name: Try
        env: { GH_TOKEN: "${{ github.token }}", TRY_SECONDS: "20400" }
        run: python retry.py | tee out.txt
      - name: Next run, or stop when found
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if grep -q "FOUND VM.Standard.A1.Flex" out.txt; then gh workflow disable retry.yml -R "$GITHUB_REPOSITORY"
          else gh workflow run retry.yml -R "$GITHUB_REPOSITORY" --ref main; fi
